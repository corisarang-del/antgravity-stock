name: Daily Financial Data Refresh

on:
  schedule:
    # UTC 21:00 = KST 06:00 (매일 새벽 6시 실행)
    - cron: '0 21 * * *'
  # 수동 트리거 (테스트용)
  workflow_dispatch:
    inputs:
      symbol:
        description: '특정 심볼만 수집 (예: NVDA AAPL). 비워두면 전체 수집.'
        required: false
        default: ''

jobs:
  refresh:
    name: Fetch & Cache Financial Data
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            "dartlab[all]>=0.5.0" \
            "yfinance>=0.2.0" \
            "supabase>=2.10.0" \
            "python-dotenv>=1.0.0" \
            "pandas>=2.2.0" \
            "pydantic-settings>=2.6.0"

      - name: Run daily refresh
        run: |
          if [ -n "${{ github.event.inputs.symbol }}" ]; then
            python backend/scripts/daily_refresh.py --symbol ${{ github.event.inputs.symbol }}
          else
            python backend/scripts/daily_refresh.py
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          APP_ENV: production
